<style>
  #gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
    background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;direction:rtl}
  #gate .box{max-width:22rem;width:88%;text-align:center;padding:2rem 1.5rem;
    background:#1e293b;border:1px solid #334155;border-radius:1.25rem}
  #gate h1{margin:0 0 .35rem;font-size:1.4rem}
  #gate p{margin:0 0 1.25rem;font-size:.85rem;line-height:1.9;color:#94a3b8}
  #gate input{width:100%;padding:.7rem;border-radius:.7rem;border:1px solid #475569;
    background:#0f172a;color:#e2e8f0;text-align:center;font-size:1.1rem;letter-spacing:.15em}
  #gate button{width:100%;margin-top:.75rem;padding:.7rem;border:0;border-radius:.7rem;
    background:#6366f1;color:#fff;font-size:1rem;cursor:pointer}
  #gate .err{color:#f87171;font-size:.8rem;height:1.2rem;margin-top:.5rem}
  html.locked #root{visibility:hidden}
</style>
<script>
  /* پیش از رنگ‌آمیزیِ صفحه تصمیم می‌گیریم تا اپ لحظه‌ای دیده نشود */
  try {
    if (localStorage.getItem('adabyar-key') !== "2383faa30b2cd5da99b10fa2a63117212a23bd589d0d370f8bf034388960beda") {
      document.documentElement.classList.add('locked')
    }
  } catch (e) { document.documentElement.classList.add('locked') }
</script>
</head>
  <body>
    <div id="root"></div>
  
<div id="gate" hidden><div class="box">
  <h1>ادب‌یار</h1>
  <p>نسخهٔ آزمایشی و محدود.<br>رمز را یک بار وارد کنید؛ به یاد می‌ماند.</p>
  <input id="pw" type="password" autocomplete="off" placeholder="رمز">
  <button id="go">ورود</button>
  <div class="err" id="err"></div>
</div></div>
<script>
(function () {
  var DIGEST = "2383faa30b2cd5da99b10fa2a63117212a23bd589d0d370f8bf034388960beda"
  var root = document.documentElement
  var gate = document.getElementById('gate')
  if (!root.classList.contains('locked')) { gate.remove(); return }
  gate.hidden = false

  var pw = document.getElementById('pw')
  var err = document.getElementById('err')

  function open() {
    try { localStorage.setItem('adabyar-key', DIGEST) } catch (e) {}
    root.classList.remove('locked')
    gate.remove()
  }
  /* صفحه‌کلیدِ فارسی ارقام را به‌شکلِ ۱۲۳ می‌فرستد، نه 123. */
  function normalize(s) {
    var fa = '۰۱۲۳۴۵۶۷۸۹'
    var ar = '٠١٢٣٤٥٦٧٨٩'
    var out = ''
    for (var i = 0; i < s.length; i++) {
      var c = s[i], j = fa.indexOf(c)
      if (j < 0) j = ar.indexOf(c)
      out += j >= 0 ? String(j) : c
    }
    return out.replace(/[\s\u200c]+/g, '').toUpperCase()
  }
  async function hash(s) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))
    return Array.from(new Uint8Array(buf)).map(function (b) {
      return b.toString(16).padStart(2, '0')
    }).join('')
  }
  async function tryOpen() {
    var v = normalize(pw.value || '')
    if (!v) return
    if (await hash(v) === DIGEST) open()
    else { err.textContent = 'رمز درست نیست.'; pw.value = ''; pw.focus() }
  }
  document.getElementById('go').addEventListener('click', tryOpen)
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryOpen() })
  pw.focus()
})()
</script>
</body>
</html>
