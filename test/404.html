(function () {

    return t && t.closest && t.closest('input,textarea,[contenteditable="true"]')
  }
  ['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (!editable(e.target)) e.preventDefault() }, true)
  })
  document.addEventListener('keydown', function (e) {

    }
  }, true)

(function () {

  var CHECK = {"__sealed":1,"iv":"tOc836jqHS3jt+FV","ct":"c4W0+QBHbZvGhf9paF9jn+XU2BWRVER5cCBd2Q=="}
  var ITER = 250000
  var root = document.documentElement
  var gate = document.getElementById('gate')
  if (!root.classList.contains('locked')) { gate.remove(); return }
  gate.hidden = false
  var pw = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go')

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u }
  function toB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s) }
  function normalize(s) {
    var fa = '۰۱۲۳۴۵۶۷۸۹', ar = '٠١٢٣٤٥٦٧٨٩', out = ''
    for (var i = 0; i < s.length; i++) {
      var c = s[i], j = fa.indexOf(c)
      if (j < 0) j = ar.indexOf(c)
      out += j >= 0 ? String(j) : c
    }
    return out.replace(/[\s\u200c-]+/g, '').toUpperCase()
  }
  async function tryOpen() {
    var v = normalize(pw.value || '')
    if (!v) return
    go.disabled = true; err.textContent = 'در حال بررسی…'
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey'])
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt'])
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(CHECK.iv) }, key, b64(CHECK.ct))
      var raw = await crypto.subtle.exportKey('raw', key)
      localStorage.setItem('adabyar-vk', toB64(raw))
      localStorage.setItem('adabyar-vk-id', SALT)
      location.reload()
    } catch (e) {
      go.disabled = false
      err.textContent = 'رمز درست نیست.'; pw.value = ''; pw.focus()
    }
  }
  go.addEventListener('click', tryOpen)
  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryOpen() })
  pw.focus()
})()
